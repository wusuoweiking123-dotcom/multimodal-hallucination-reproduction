[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-hallucination-reproduction"
version = "0.1.0"
description = "Paper-faithful, model-agnostic reproductions of SEASON, CMAC, and R2-TAR."
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

