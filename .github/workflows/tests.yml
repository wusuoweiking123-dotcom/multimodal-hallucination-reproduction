name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  numerical-kernels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run smoke test
        run: python scripts/smoke_test.py
